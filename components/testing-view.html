<div class="module-content hidden" id="testing-view-container" style="padding: 20px; width: 100%;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--primary-blue);"><i class="fa-solid fa-bug"></i> SYSTEM TESTING (ADMIN DASHBOARD)</h2>
    </div>

    <!-- Zone A: Control Panel -->
    <div class="card" style="margin-bottom: 20px; padding: 20px; border-left: 4px solid var(--primary-blue);">
        <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem;">Zone A: Control Panel</h3>
        <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
            <button id="btn-start-autotest" class="btn btn-primary" style="font-size: 1rem; padding: 10px 20px;">
                🚀 BẮT ĐẦU AUTO-TEST WORKFLOW
            </button>
            <div style="display: flex; gap: 15px;">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="chk-visual-delay" checked>
                    Chạy hiệu ứng trực quan (Delay 600ms)
                </label>
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="chk-auto-export" checked>
                    Tự động xuất file .txt khi có lỗi
                </label>
            </div>
        </div>
    </div>

    <!-- Zone B: Test Matrix KPI Summary -->
    <div class="card" style="margin-bottom: 20px; padding: 20px;">
        <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem;">Zone B: Test Matrix KPI Summary</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center;">
                <div style="font-size: 0.85rem; color: #64748b; font-weight: 600; text-transform: uppercase;">Tổng Test Cases</div>
                <div id="kpi-total-tests" style="font-size: 1.8rem; font-weight: 700; color: #0f172a; margin-top: 5px;">0</div>
            </div>
            <div style="background: #ecfdf5; border: 1px solid #d1fae5; border-radius: 8px; padding: 15px; text-align: center;">
                <div style="font-size: 0.85rem; color: #059669; font-weight: 600; text-transform: uppercase;">Thành công (Pass)</div>
                <div id="kpi-pass-tests" style="font-size: 1.8rem; font-weight: 700; color: #10b981; margin-top: 5px;">0</div>
            </div>
            <div style="background: #fef2f2; border: 1px solid #fee2e2; border-radius: 8px; padding: 15px; text-align: center;">
                <div style="font-size: 0.85rem; color: #e11d48; font-weight: 600; text-transform: uppercase;">Thất bại (Fail)</div>
                <div id="kpi-fail-tests" style="font-size: 1.8rem; font-weight: 700; color: #ef4444; margin-top: 5px;">0</div>
            </div>
            <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center;">
                <div style="font-size: 0.85rem; color: #64748b; font-weight: 600; text-transform: uppercase;">Thời gian thực thi (s)</div>
                <div id="kpi-time-tests" style="font-size: 1.8rem; font-weight: 700; color: #0f172a; margin-top: 5px;">0.00</div>
            </div>
        </div>
    </div>

    <!-- Zone C: Live Terminal & .TXT Log Exporter -->
    <div class="card" style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0; font-size: 1.1rem;">Zone C: Live Terminal & .TXT Log Exporter</h3>
            <button id="btn-export-log" class="btn btn-secondary" style="display: none;">
                <i class="fa-solid fa-download"></i> Tải File Log (.txt)
            </button>
        </div>
        <div id="testing-terminal" style="background: #1e293b; color: #38bdf8; font-family: monospace; font-size: 0.9rem; padding: 15px; border-radius: 8px; height: 350px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5;">&gt; Waiting to start...</div>
    </div>
</div>
