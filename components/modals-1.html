    <!-- Modal -->
    <div id="payment-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Payment Claim</h2>
                <button id="close-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="payment-form">
                <div class="form-group">
                    <label for="contract-select">Select Contract</label>
                    <select id="contract-select" required>
                        <!-- Options injected by JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="payment-amount">Claim Amount ($)</label>
                    <input type="number" id="payment-amount" placeholder="e.g. 50000" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Entry Modal -->
    <div id="new-entry-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Budget Entry</h2>
                <button id="close-entry-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="new-entry-form">
                <div class="form-group">
                    <label for="entry-category">Category Name</label>
                    <input type="text" id="entry-category" placeholder="e.g. Foundation Works" required>
                </div>
                <div class="form-group">
                    <label for="entry-amount">Budgeted Amount ($)</label>
                    <input type="number" id="entry-amount" placeholder="e.g. 1500000" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-entry-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Project Modal -->
    <div id="new-project-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Thêm dự án mới</h2>
                <button id="close-project-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="new-project-form">
                <div class="form-group">
                    <label for="proj-name">Tên dự án</label>
                    <input type="text" id="proj-name" required>
                </div>
                <div class="form-group">
                    <label for="proj-location">Địa điểm</label>
                    <input type="text" id="proj-location" required>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="proj-start">Ngày bắt đầu</label>
                        <input type="date" id="proj-start" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="proj-end">Ngày kết thúc</label>
                        <input type="date" id="proj-end" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="proj-budget">Tổng dự toán ($)</label>
                    <input type="number" id="proj-budget" required>
                </div>
                <div class="form-group">
                    <label for="proj-contingency">Dự phòng phí ($)</label>
                    <input type="number" id="proj-contingency" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-project-modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Tender Modal -->
    <div id="new-tender-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tạo Gói thầu mới</h2>
                <button id="close-tender-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="new-tender-form">
                <div class="form-group">
                    <label for="tender-code">Mã gói thầu</label>
                    <input type="text" id="tender-code" required>
                </div>
                <div class="form-group">
                    <label for="tender-name">Tên gói thầu</label>
                    <input type="text" id="tender-name" required>
                </div>
                <div class="form-group">
                    <label for="tender-budget">Giá dự toán ($)</label>
                    <input type="number" id="tender-budget" required>
                </div>
                <div class="form-group">
                    <label for="tender-deadline">Hạn nộp HSĐX</label>
                    <input type="date" id="tender-deadline" required>
                </div>
                <div class="form-group">
                    <label for="tender-status">Trạng thái</label>
                    <select id="tender-status" required>
                        <option value="Floating">Đang phát hành HSMT (Floating)</option>
                        <option value="Evaluating">Đang chấm thầu (Evaluating)</option>
                        <option value="Awarded">Đã trao thầu (Awarded)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tender-deadline">Hạn nộp HSĐX</label>
                    <input type="date" id="tender-deadline" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-tender-modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Award Tender Modal -->
    <div id="award-tender-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏆 Chốt Chọn Nhà Thầu</h2>
                <button id="close-award-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="award-tender-form">
                <div class="form-group">
                    <label for="award-winner">Nhà thầu trúng thầu</label>
                    <input type="text" id="award-winner" placeholder="Nhập tên Nhà Thầu trúng thầu (VD: Công ty Cổ phần SCQC)..." required style="width:100%; padding:0.5rem 0.75rem; border:1px solid #d1d5db; border-radius:0.5rem; font-size:0.875rem;">
                </div>
                <div class="form-group">
                    <label for="award-price">Giá chốt thầu ($)</label>
                    <input type="text" id="award-price" placeholder="e.g. 50,000" onblur="window.formatInputNumber(this)" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-award-modal">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="background-color: var(--primary-green);">Xác Nhận Trúng Thầu</button>
                </div>
            </form>
        </div>
    </div>
