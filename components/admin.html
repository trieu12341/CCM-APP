<div id="module-admin" class="module-content hidden">
    <div class="card" style="padding: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--text-color);">Quản lý Tài khoản (User Management)</h2>
            <div class="text-sm text-gray-500">Bạn đang đăng nhập với quyền <strong>Admin</strong></div>
        </div>

        <div class="table-container">
            <table class="data-table" id="admin-users-table">
                <thead>
                    <tr>
                        <th style="width: 25%">Tên (Name)</th>
                        <th style="width: 30%">Email</th>
                        <th style="width: 20%">Phân quyền (Role)</th>
                        <th style="width: 25%">Ngày tham gia</th>
                    </tr>
                </thead>
                <tbody id="admin-users-tbody">
                    <!-- Data injected via JS -->
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
