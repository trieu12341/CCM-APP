<header class="topbar">
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search">
    </div>
    <div class="topbar-actions" style="display: flex; align-items: center; gap: 15px;">
        <i class="fa-regular fa-bell"></i>
        <div id="user-info" style="display: flex; align-items: center; gap: 10px;">
            <div style="text-align: right;">
                <div id="user-name" style="font-weight: 600; font-size: 0.9rem;">-</div>
                <div id="user-role" style="font-size: 0.75rem; color: var(--text-muted); text-transform: capitalize;">-</div>
            </div>
            <img src="https://i.pravatar.cc/150?img=68" alt="Profile" class="avatar-small">
            <div class="admin-tools manager-only" style="display: none; align-items: center; gap: 8px; border-right: 1px solid #e2e8f0; padding-right: 10px; margin-right: 5px;">
                <button id="btn-admin-restore" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; color: #3b82f6; border-color: #bfdbfe;" title="Khôi phục dữ liệu từ file Backup JSON">
                    <i class="fa-solid fa-download"></i> Restore Backup
                </button>
                <input type="file" id="admin-restore-file" accept=".json" style="display: none;">
                <button id="btn-admin-reset" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; color: #ef4444; border-color: #fecaca; background: #fef2f2;" title="Reset dữ liệu test hệ thống">
                    <i class="fa-solid fa-triangle-exclamation"></i> System Reset
                </button>
            </div>
            <button id="btn-logout" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
        </div>
    </div>
</header>
