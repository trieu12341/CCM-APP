<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost & Contract Management</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>
    <div class="app-container" id="app-container" style="display:none;">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="topbar-container"></div>
            <div class="content-wrapper">
                <div class="project-tabs-container" id="project-tabs-container"></div>
                <div id="project-header-container"></div>
                <div id="modules-1-container"></div>
                <div id="modules-2-container"></div>
            </div>
        </main>
    </div>

    <div id="modals-1-container"></div>
    <div id="modals-2-container"></div>

    <script type="module" src="js/app.js"></script>
    <script type="module">
        import { loadComponent } from './js/utils/html-loader.js';

        async function boot() {
            await Promise.all([
                loadComponent('sidebar-container', 'components/sidebar.html'),
                loadComponent('topbar-container', 'components/topbar.html'),
                loadComponent('project-header-container', 'components/project-header.html'),
                loadComponent('modules-1-container', 'components/modules-1.html'),
                loadComponent('modules-2-container', 'components/modules-2.html'),
                loadComponent('modals-1-container', 'components/modals-1.html'),
                loadComponent('modals-2-container', 'components/modals-2.html')
            ]);
            document.dispatchEvent(new Event('componentsLoaded'));
        }

        document.addEventListener('DOMContentLoaded', boot);
    </script>
</body>

</html>
