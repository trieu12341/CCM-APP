    <!-- Project Summary Modal -->
    <div id="project-summary-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 800px; width: 90%;">
            <div class="modal-header">
                <h2>Tóm tắt Dự án (Project Profile)</h2>
                <button id="close-summary-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="summary-body" style="display: flex; gap: 2rem; padding: 1rem 0;">
                <!-- Left Column: Image -->
                <div class="summary-left" style="flex: 1; display: flex; flex-direction: column; gap: 1rem;">
                    <div style="width: 100%; height: 250px; background: #f1f5f9; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                        <img id="summary-img-view" src="" alt="Project Image" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <i id="summary-img-placeholder" class="fa-regular fa-image" style="font-size: 4rem; color: #cbd5e1;"></i>
                    </div>
                    
                    <div id="summary-img-edit-wrap" class="hidden">
                        <label style="font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Ảnh dự án:</label>
                        
                        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <button type="button" class="btn btn-secondary" onclick="document.getElementById('summary-img-upload').click()" style="flex: 1; justify-content: center;"><i class="fa-solid fa-upload"></i> Tải ảnh lên</button>
                            <input type="file" id="summary-img-upload" accept="image/*" style="display: none;">
                        </div>
                        
                        <div style="text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">- HOẶC -</div>
                        
                        <input type="text" id="summary-img-input" placeholder="Nhập link ảnh (URL)" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                    </div>
                </div>
                
                <!-- Right Column: Info -->
                <div class="summary-right" style="flex: 1.5; display: flex; flex-direction: column; gap: 1rem;">
                    <!-- View Mode -->
                    <div id="summary-view-mode">
                        <div style="margin-bottom: 1rem;">
                            <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Tên dự án</div>
                            <div id="summary-name-view" style="font-size: 1.2rem; font-weight: 700;">-</div>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Quy mô</div>
                            <div id="summary-scale-view" style="font-weight: 500;">-</div>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Địa điểm</div>
                            <div id="summary-location-view" style="font-weight: 500;">-</div>
                        </div>
                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div style="flex: 1;">
                                <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Ngày bắt đầu</div>
                                <div id="summary-start-date-view" style="font-weight: 500;">-</div>
                            </div>
                            <div style="flex: 1;">
                                <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Ngày kết thúc</div>
                                <div id="summary-end-date-view" style="font-weight: 500;">-</div>
                            </div>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Diện tích CFA (m2)</div>
                            <div id="summary-cfa-view" style="font-weight: 500;">-</div>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Nhà thầu chính</div>
                            <div id="summary-contractor-view" style="font-weight: 500;">-</div>
                        </div>
                    </div>

                    <!-- Edit Mode -->
                    <div id="summary-edit-mode" class="hidden">
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label>Tên dự án</label>
                            <input type="text" id="summary-name-input" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label>Quy mô</label>
                            <input type="text" id="summary-scale-input">
                        </div>
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label>Địa điểm</label>
                            <input type="text" id="summary-location-input">
                        </div>
                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group" style="flex: 1;">
                                <label>Ngày bắt đầu</label>
                                <input type="date" id="summary-start-date-input">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label>Ngày kết thúc</label>
                                <input type="date" id="summary-end-date-input">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label>Diện tích CFA (m2)</label>
                            <input type="number" id="summary-cfa-input">
                        </div>
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label>Danh sách Tư vấn</label>
                            <textarea id="summary-consultants-input" rows="3"
                                style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; font-family: inherit; resize: vertical;"></textarea>
                        </div>
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label>Nhà thầu chính</label>
                            <input type="text" id="summary-contractor-input">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer"
                style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <button type="button" class="btn btn-secondary" id="btn-edit-summary">Sửa Thông Tin</button>
                <button type="button" class="btn btn-primary hidden" id="btn-save-summary">Lưu Cập Nhật</button>
            </div>
        </div>
    </div>
