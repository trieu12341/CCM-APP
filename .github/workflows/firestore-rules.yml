# Deploy Firestore rules (phân quyền) — chỉ chạy khi firestore.rules thay đổi
# hoặc bấm "Run workflow" trong tab Actions.
# Service account trong secret FIREBASE_SERVICE_ACCOUNT cần các vai trò IAM:
#   - Firebase Rules Admin
#   - Service Usage Consumer
name: Deploy Firestore rules

on:
  push:
    branches: [master]
    paths: ['firestore.rules', 'firebase.json']
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Firestore rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules \
            --project cost-contract-management --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
