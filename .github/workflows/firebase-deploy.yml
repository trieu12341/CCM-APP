# Deploy Firebase Hosting khi master có commit mới — CHỈ khi bộ kiểm thử đầy đủ đạt.
# Cần secret FIREBASE_SERVICE_ACCOUNT (JSON khóa service account) trong
# GitHub → Settings → Secrets and variables → Actions.
# Firestore rules deploy ở workflow riêng: firestore-rules.yml
name: Deploy Firebase Hosting

on:
  push:
    branches: [master]
  workflow_dispatch:   # cho phép bấm chạy tay trong tab Actions

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-full.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cost-contract-management
          channelId: live
